<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>guideGlass</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 1.5rem;
      text-align: center;
      padding: 1rem;
    }
    h1 { margin-bottom: 0; }
    #status { color: #999; }
    #wsUrl {
      width: 20rem;
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      border: 1px solid #444;
      background: #222;
      color: #eee;
    }
    button {
      font-size: 1.5rem;
      padding: 1rem 3rem;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
      background: #2e7d32;
      color: white;
    }
    button.active { background: #c62828; }
    #guidance {
      max-width: 30rem;
      min-height: 3rem;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <h1>guideGlass</h1>
  <input id="wsUrl" value="ws://localhost:8123/ws" />
  <button id="toggle">Start</button>
  <div id="status">disconnected</div>
  <div id="guidance"></div>

  <script>
    const toggleBtn = document.getElementById('toggle');
    const statusEl = document.getElementById('status');
    const guidanceEl = document.getElementById('guidance');
    const wsUrlInput = document.getElementById('wsUrl');

    let ws = null;
    let active = false;

    function speak(text) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }

    function connect() {
      ws = new WebSocket(wsUrlInput.value);

      ws.onopen = () => {
        statusEl.textContent = 'connected';
        ws.send(JSON.stringify({ action: 'start' }));
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'guidance') {
          guidanceEl.textContent = msg.text;
          speak(msg.text);
        }
      };

      ws.onclose = () => {
        statusEl.textContent = 'disconnected';
        active = false;
        toggleBtn.textContent = 'Start';
        toggleBtn.classList.remove('active');
      };

      ws.onerror = () => {
        statusEl.textContent = 'connection error';
      };
    }

    toggleBtn.onclick = () => {
      active = !active;
      toggleBtn.textContent = active ? 'Stop' : 'Start';
      toggleBtn.classList.toggle('active', active);

      if (active) {
        connect();
      } else if (ws) {
        ws.send(JSON.stringify({ action: 'stop' }));
        ws.close();
      }
    };
  </script>
</body>
</html>
